[project]
name = "cameo-agents"
version = "0.1.0"
description = "Cameo API: personalized product placement in finished video with Gemini, Cloud Vision, Nano Banana and Gemini Omni"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.7", "google-genai>=2.31", "numpy>=1.26", "google-cloud-vision>=3.7", "google-cloud-storage>=3.0", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "opencv-python-headless>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = ["cameo_agents"]

[tool.setuptools.package-data]
cameo_agents = ["models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
